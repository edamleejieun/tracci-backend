spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tracci_dev
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-init-sql: SET TIME ZONE 'UTC'
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          min-idle: 2
          max-active: 8

tracci:
  cors:
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "http://[::1]:*"

  jwt:
    secret-key: dev-secret-key-please-change-in-production-must-be-at-least-256-bits
    access-token-expire: 7200       # 2 小时，单位秒
    refresh-token-expire: 2592000   # 30 天，单位秒

  integration:
    sms:
      mock: ${TRACCI_SMS_MOCK:true}       # 本地默认 mock；联调真实 PNVS 时设 TRACCI_SMS_MOCK=false
#      mock-fixed-code: "123456"
    email:
      mock: true       # 开发环境日志打印验证码，不真实发送邮件
      # 本地联调真实发信时可改为 false，并填写以下参数：
      # secret-id: ${TENCENT_SES_SECRET_ID:}
      # secret-key: ${TENCENT_SES_SECRET_KEY:}
      # from-email: ${TENCENT_SES_FROM_EMAIL:}
      # reset-password-template-id: ${TENCENT_SES_RESET_PASSWORD_TEMPLATE_ID:}
      # bind-email-template-id: ${TENCENT_SES_BIND_EMAIL_TEMPLATE_ID:}
    cos:
      enabled: true
      mock: ${TENCENT_COS_MOCK:true}
      secret-id: ${TENCENT_COS_SECRET_ID:}
      secret-key: ${TENCENT_COS_SECRET_KEY:}
      region: ${TENCENT_COS_REGION:ap-shanghai}
      bucket: ${TENCENT_COS_BUCKET:}
      public-base-url: ${TENCENT_COS_PUBLIC_BASE_URL:}
      upload-url-expire-seconds: 600
      access-url-expire-seconds: 1800
      max-image-size-bytes: 5242880
      allowed-image-types:
        - image/jpeg
        - image/png
        - image/webp
        - image/avif
        - image/gif
        - image/bmp
        - image/tiff
        - image/heic
        - image/heif
      ci:
        enabled: true
        thumbnail-rule: "imageMogr2/thumbnail/720x/quality/85"
        preview-rule: "imageView2/2/w/1080/q/85"
        export-rule: "imageMogr2/thumbnail/1080x>/quality/90"
        story-portrait-rule: "imageMogr2/scrop/1080x1920/format/webp/quality/88"
        story-card-rule: "imageMogr2/scrop/1080x1440/format/webp/quality/88"
        square-rule: "imageMogr2/scrop/720x720/format/webp/quality/85"
        watermark-enabled: false
        watermark-rule: ""
    tencent-wsa:
      enabled: ${TRACCI_TENCENT_WSA_ENABLED:false}
      secret-id: ${TRACCI_TENCENT_WSA_SECRET_ID:}
      secret-key: ${TRACCI_TENCENT_WSA_SECRET_KEY:}
    exchange-rate:
      api-key: ${EXCHANGE_RATE_API_KEY:mock}
      base-url: https://v6.exchangerate-api.com

  wechat:
    mini-program:
      mock: ${WECHAT_MINI_MOCK:true}       # 开发环境 code 哈希生成 mock openid
      app-id: ${WECHAT_MINI_APP_ID:mock-app-id}
      app-secret: ${WECHAT_MINI_APP_SECRET:mock-app-secret}
      timeout-ms: 3000
      content-security-enabled: ${WECHAT_MINI_CONTENT_SECURITY_ENABLED:true}
    app:
      mock: ${WECHAT_APP_MOCK:true}        # 开发环境 code 哈希生成 mock openid/unionid
      app-id: ${WECHAT_APP_APP_ID:}
      app-secret: ${WECHAT_APP_APP_SECRET:}
      timeout-ms: 3000

  # dev 环境可通过 enable-amap-for-ios: true 临时开启 iOS 高德调用（联调/授权后）
  location:
    default-provider: AMAP
    ios-provider: DISABLED
    wechat-mini-provider: AMAP
    enable-amap-for-ios: false
  weather:
    default-provider: AMAP
    ios-provider: APPLE_CLIENT
    wechat-mini-provider: AMAP
    enable-amap-for-ios: false

  # dev 环境覆盖：开启测试账号（便于联调）
  auth:
    test-accounts:
      enabled: true
      accounts:
        - login-id: admin
          password: admin123456
          email: admin@tracci.local
    features:
      email-reset-password-enabled: true

  # dev 环境：测试账号 admin@tracci.local 拥有 admin 权限
  # initializer 会自动创建用户（如果不存在）；default-password 仅在用户不存在时使用
  admin:
    user-ids: []
    admin-emails:
      - admin@tracci.local
    default-password: admin123456

logging:
  level:
    com.tracci: DEBUG
    org.springframework.web: DEBUG
