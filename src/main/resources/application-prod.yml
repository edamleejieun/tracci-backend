spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-init-sql: SET TIME ZONE 'UTC'
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          min-idle: 5
          max-active: 20

tracci:
  request-logging:
    enabled: ${TRACCI_REQUEST_LOGGING_ENABLED:true}
    skip-path-patterns:
      - /actuator/health
      - /actuator/info

  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expire: 7200
    refresh-token-expire: 2592000

  integration:
    sms:
      mock: false
    aliyun-pnvs:
      access-key-id: ${ALIYUN_PNVS_ACCESS_KEY_ID}
      access-key-secret: ${ALIYUN_PNVS_ACCESS_KEY_SECRET}
      endpoint: ${ALIYUN_PNVS_ENDPOINT:dypnsapi.aliyuncs.com}
      region-id: ${ALIYUN_PNVS_REGION_ID:cn-hangzhou}
      country-code: ${ALIYUN_PNVS_COUNTRY_CODE:86}
      scheme-name: ${ALIYUN_PNVS_SCHEME_NAME:}
      sign-name: ${ALIYUN_PNVS_SIGN_NAME}
      template-code: ${ALIYUN_PNVS_TEMPLATE_CODE}
      template-param: ${ALIYUN_PNVS_TEMPLATE_PARAM}
    email:
      mock: false
      secret-id: ${TENCENT_SES_SECRET_ID}
      secret-key: ${TENCENT_SES_SECRET_KEY}
      region: ${TENCENT_SES_REGION:ap-guangzhou}
      from-email: ${TENCENT_SES_FROM_EMAIL}
      from-name: ${TENCENT_SES_FROM_NAME:趣溪}
      reply-to: ${TENCENT_SES_REPLY_TO:}
      trigger-type: 1
      reset-password-template-id: ${TENCENT_SES_RESET_PASSWORD_TEMPLATE_ID}
      reset-password-subject: ${TENCENT_SES_RESET_PASSWORD_SUBJECT:【趣溪】找回密码验证码}
      bind-email-template-id: ${TENCENT_SES_BIND_EMAIL_TEMPLATE_ID}
      bind-email-subject: ${TENCENT_SES_BIND_EMAIL_SUBJECT:【趣溪】绑定邮箱验证码}
    cos:
      enabled: true
      mock: false
      secret-id: ${TENCENT_COS_SECRET_ID}
      secret-key: ${TENCENT_COS_SECRET_KEY}
      region: ${TENCENT_COS_REGION:ap-guangzhou}
      bucket: ${TENCENT_COS_BUCKET}
      # 仅在对象可匿名读取时配置公开域名（例如已启用的 CDN 或公开读 COS 域名）
      # 私有桶且未开 CDN 时保持为空，后端会返回预签名访问 URL
      public-base-url: ${TENCENT_COS_PUBLIC_BASE_URL:}
      upload-url-expire-seconds: 600
      access-url-expire-seconds: 1800
      max-image-size-bytes: 5242880
      ci:
        enabled: ${TENCENT_COS_CI_ENABLED:true}
        thumbnail-rule: ${TENCENT_COS_CI_THUMBNAIL_RULE:imageMogr2/thumbnail/720x/quality/85}
        preview-rule: ${TENCENT_COS_CI_PREVIEW_RULE:imageView2/2/w/1080/q/85}
        export-rule: ${TENCENT_COS_CI_EXPORT_RULE:imageMogr2/thumbnail/1080x>/quality/90}
        story-portrait-rule: ${TENCENT_COS_CI_STORY_PORTRAIT_RULE:imageMogr2/scrop/1080x1920/format/webp/quality/88}
        story-card-rule: ${TENCENT_COS_CI_STORY_CARD_RULE:imageMogr2/scrop/1080x1440/format/webp/quality/88}
        square-rule: ${TENCENT_COS_CI_SQUARE_RULE:imageMogr2/scrop/720x720/format/webp/quality/85}
        watermark-enabled: ${TENCENT_COS_CI_WATERMARK_ENABLED:false}
        watermark-rule: ${TENCENT_COS_CI_WATERMARK_RULE:}
    exchange-rate:
      mock: false
      api-key: ${EXCHANGE_RATE_API_KEY}
      base-url: https://v6.exchangerate-api.com
    tencent-wsa:
      enabled: ${TRACCI_TENCENT_WSA_ENABLED:false}
      secret-id: ${TRACCI_TENCENT_WSA_SECRET_ID:}
      secret-key: ${TRACCI_TENCENT_WSA_SECRET_KEY:}

  expense:
    # 初版只支持 CNY；后续接入真实汇率后可用环境变量启用多币种。
    multi-currency-enabled: ${TRACCI_EXPENSE_MULTI_CURRENCY_ENABLED:false}

  wechat:
    mini-program:
      mock: false
      app-id: ${WECHAT_MINI_APP_ID}
      app-secret: ${WECHAT_MINI_APP_SECRET}
      timeout-ms: 3000
      content-security-enabled: ${WECHAT_MINI_CONTENT_SECURITY_ENABLED:true}
    app:
      mock: false
      app-id: ${WECHAT_APP_APP_ID}
      app-secret: ${WECHAT_APP_APP_SECRET}
      timeout-ms: 3000

  # 生产环境：测试账号关闭；登录方式始终可用，由前端控制展示
  auth:
    test-accounts:
      enabled: false
    features:
      email-reset-password-enabled: true

  # 生产环境：iOS 默认不调用高德 POI/天气；可通过 enable-amap-for-ios 在购授权后开启
  location:
    default-provider: AMAP
    ios-provider: DISABLED
    wechat-mini-provider: AMAP
    enable-amap-for-ios: false
  weather:
    default-provider: AMAP
    ios-provider: APPLE_CLIENT
    wechat-mini-provider: AMAP
    enable-amap-for-ios: false

# 生产环境关闭 Swagger
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    com.tracci: INFO
